name: Build

# Build only: catches a broken build before merging. No signing, no release, no secrets.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: 8.0.x

      # Same publish as the release, so a problem there shows up here first.
      - name: Publish (self-contained, win-x64)
        run: dotnet publish src/Arca -c Release -r win-x64 --self-contained true -o "${{ runner.temp }}/arca-build"

      # 7z and password-protected archives need 7-Zip beside Arca.exe, and its licence needs its License.txt there too.
      - name: Check 7-Zip is included
        shell: pwsh
        run: |
          foreach ($f in '7-Zip/7za.exe', '7-Zip/License.txt') {
            if (-not (Test-Path (Join-Path $env:RUNNER_TEMP "arca-build/$f"))) { throw "$f is missing from the build." }
          }

      # Starts the real app and checks it stays open, so a crash on start shows up here, with its reason.
      - name: Startup check
        shell: pwsh
        env:
          ARCA_NO_CRASH_DIALOG: '1'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'arca-build/Arca.exe'
          $version = (& $exe --version | Out-String).Trim()
          Write-Host "Arca.exe --version: '$version' (exit code $LASTEXITCODE)"

          $log = Join-Path $env:LOCALAPPDATA 'Arca/crash.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $start = (Get-Date).AddSeconds(-2)
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force } else { Write-Host "Arca exited by itself with code $($p.ExitCode)" }
          Write-Host "Still running after 20 seconds: $alive"

          if (Test-Path $log) { Write-Host '----- crash.log -----'; Get-Content $log | Write-Host }
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $start } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting', 'SideBySide' } |
            ForEach-Object { Write-Host "----- $($_.ProviderName) -----"; Write-Host $_.Message }

          if (-not $alive -or (Test-Path $log)) { throw 'Arca did not start cleanly; the reason is printed above.' }

      # Unsigned, for trying a pull request on a PC before it is merged. Kept 7 days.
      - name: Keep the build (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: Arca-unsigned-${{ github.run_number }}-win-x64
          path: ${{ runner.temp }}/arca-build
          retention-days: 7

      # The core library (formats, path safety, zip-bomb limits) is plain .NET, so its tests run here too.
      - name: Test
        run: dotnet test tests/Arca.Core.Tests -c Release
